[project]
name = "walkscape-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marcusds", email = "git@marcusds.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "libzim>=3.13.0",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
]

[project.scripts]
walkscape-mcp = "walkscape_mcp:main"
walkscape-drift = "walkscape_mcp.drift:main"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
